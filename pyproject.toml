[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
  "scripts/__pycache__",
  "tests/__pycache__",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
