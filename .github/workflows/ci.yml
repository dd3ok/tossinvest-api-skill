name: TossInvest API Skills CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install development tools
        run: python -m pip install ruff

      - name: Check formatting
        run: ruff format --check .

      - name: Run lint
        run: ruff check .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Skill layout smoke test
        shell: bash
        run: |
          set -euo pipefail
          skill_dir="$(mktemp -d)/tossinvest-web-api"
          mkdir -p "$skill_dir"
          cp -R SKILL.md README.md LICENSE SECURITY.md agents examples references scripts "$skill_dir"/
          test -f "$skill_dir/SKILL.md"
          test -f "$skill_dir/agents/openai.yaml"
          test -f "$skill_dir/references/api-catalog.md"
          python "$skill_dir/scripts/stock_summary.py" --help >/dev/null

      - name: Compile scripts
        shell: bash
        run: |
          set -euo pipefail
          for file in scripts/*.py; do
            python -m py_compile "$file"
          done

      - name: Check script help commands
        shell: bash
        run: |
          set -euo pipefail
          for file in scripts/*.py; do
            python "$file" --help >/dev/null
          done

      - name: Validate JSON examples
        shell: bash
        run: |
          set -euo pipefail
          for file in examples/filters/*.json; do
            python -m json.tool "$file" >/dev/null
          done
