name: TossInvest API Skill CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install development tools
        run: python -m pip install "ruff==0.15.22"

      - name: Install Agent Skills validator
        run: python -m pip install "skills-ref==0.1.1"

      - name: Install locked WebSocket dependency for tests
        run: python -m pip install -r requirements-websocket.txt

      - name: Check formatting
        run: ruff format --check .

      - name: Run lint
        run: ruff check .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Skill layout smoke test
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(mktemp -d)"
          skill_dir="$workspace/.agents/skills/tossinvest-web-api"
          mkdir -p "$skill_dir"
          cp -R SKILL.md README.md LICENSE SECURITY.md agents examples references scripts "$skill_dir"/
          cp requirements-websocket.txt "$skill_dir"/
          test -f "$skill_dir/SKILL.md"
          test -f "$skill_dir/agents/openai.yaml"
          test -f "$skill_dir/references/api-catalog.md"
          test -f "$skill_dir/references/websocket-api-reference.md"
          test -f "$skill_dir/requirements-websocket.txt"
          test -f "$skill_dir/scripts/websocket_prices.py"
          agentskills validate "$skill_dir"
          python "$skill_dir/scripts/stock_summary.py" --help >/dev/null
          python "$skill_dir/scripts/websocket_prices.py" --help >/dev/null

      - name: Compile scripts
        shell: bash
        run: |
          set -euo pipefail
          for file in scripts/*.py; do
            python -m py_compile "$file"
          done

      - name: Check script help commands
        shell: bash
        run: |
          set -euo pipefail
          for file in scripts/*.py; do
            python "$file" --help >/dev/null
          done

      - name: Validate JSON examples
        shell: bash
        run: |
          set -euo pipefail
          for file in examples/filters/*.json; do
            python -m json.tool "$file" >/dev/null
          done
